<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LT1</title>
<style>
  :root {
    --bg: #111318;
    --panel: #1b1e26;
    --text: #e8eaf0;
    --muted: #9aa1b2;
    --accent: #4f8cff;
    --danger: #e5484d;
    --ok: #30a46c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .room { color: var(--muted); font-family: ui-monospace, Consolas, monospace; }
  .spacer { flex: 1; }
  .badge { padding: 3px 10px; border-radius: 999px; background: #2a2f3a; color: var(--muted); font-size: 13px; }
  .badge.live { background: var(--danger); color: #fff; }
  .badge.ok { background: var(--ok); color: #fff; }
  button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 0; cursor: pointer;
    background: var(--accent); color: #fff; }
  button.stop { background: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  main { flex: 1; position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center; text-align: center; padding: 16px; pointer-events: none; }
  .overlay > * { pointer-events: auto; }
  .overlay p { margin: 0; color: var(--muted); max-width: 520px; }
  /* Viewer player bar: lives inside <main> so it stays visible in fullscreen. */
  .controls { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 6px;
    padding: 24px 14px 10px; background: linear-gradient(transparent, rgba(0, 0, 0, .75));
    transition: opacity .25s; }
  .controls.idle { opacity: 0; pointer-events: none; }
  main.idle { cursor: none; }
  .controls button { padding: 4px 8px; background: transparent; font-size: 20px; line-height: 1; }
  .controls button:hover { background: rgba(255, 255, 255, .12); }
  .controls input { width: 120px; accent-color: var(--accent); cursor: pointer; }
  .controls span { min-width: 3.2em; color: #d6d9e0; font-size: 13px; font-variant-numeric: tabular-nums; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>LT1</h1>
  <span class="room" id="room"></span>
  <span class="spacer"></span>
  <span class="badge" id="status">Conectando...</span>
  <button id="startBtn" class="hidden">Iniciar transmissão</button>
  <button id="stopBtn" class="stop hidden">Parar</button>
</header>
<main id="player">
  <video id="video" playsinline autoplay muted></video>
  <div class="overlay" id="overlay">
    <p id="message">Conectando...</p>
    <button id="unmuteBtn" class="hidden">🔊 Clique para ativar o som</button>
  </div>
  <div class="controls hidden" id="controls">
    <button id="muteBtn" title="Mute (M)" aria-label="Mute">🔇</button>
    <input id="volumeSlider" type="range" min="0" max="100" step="1" value="100" aria-label="Volume">
    <span id="volumeLabel">100%</span>
    <span class="spacer"></span>
    <button id="fullscreenBtn" title="Tela cheia (F)" aria-label="Tela cheia">⛶</button>
  </div>
</main>

<script type="module">
  import { joinRoom } from 'https://cdn.jsdelivr.net/npm/trystero@0.25.4/+esm';

  // Must be identical for broadcaster and viewers.
  const APP_ID = 'lt1-screensy-direct-v1';

  // Relay used only when a direct connection is impossible (CGNAT / symmetric NAT).
  // Trystero ships STUN only, so without this many viewers never connect.
  // The Worker (cloudflare/turn-worker.js) returns short-lived Cloudflare TURN credentials.
  const TURN_ENDPOINT = 'https://lightone-turn.carekovisk.workers.dev/';

  // Firefox warns that 5+ STUN/TURN URLs slow discovery (it took ~11 s with all of them).
  // Keep one STUN, TURN over UDP (fastest) and TURN over TLS 443 (passes most firewalls).
  const KEEP_ICE_URL = /^stun:|^turn:.*:3478\?transport=udp$|^turns:.*:443\?transport=tcp$/;
  const trimIceServers = (iceServers) => {
    let stunKept = false;
    const trimmed = iceServers.map(server => ({
      ...server,
      urls: [].concat(server.urls).filter(url => {
        if (!KEEP_ICE_URL.test(url)) return false;
        if (!url.startsWith('stun:')) return true;
        return stunKept ? false : (stunKept = true);
      })
    })).filter(server => server.urls.length > 0);
    // If Cloudflare ever renames its URLs, use them all rather than lose the relay.
    return trimmed.some(s => s.urls.some(u => /^turns?:/.test(u))) ? trimmed : iceServers;
  };

  // Started right away so it overlaps page setup; on any failure we fall back to STUN only.
  const turnServersPromise = (async () => {
    if (!TURN_ENDPOINT) return [];
    try {
      const res = await fetch(TURN_ENDPOINT, { signal: AbortSignal.timeout(4000), cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const { iceServers } = await res.json();
      return Array.isArray(iceServers) ? trimIceServers(iceServers) : [];
    } catch (e) {
      console.warn('[LT1] TURN unavailable, direct connections only', e);
      return [];
    }
  })();

  // The wrapper serves this page at https://lt1.stream/ -> broadcaster.
  // Anywhere else (GitHub Pages) -> viewer. "?broadcast" forces broadcaster for testing.
  const isBroadcaster = location.hostname === 'lt1.stream' ||
    new URLSearchParams(location.search).has('broadcast');

  const $ = (id) => document.getElementById(id);
  const video = $('video'), message = $('message');
  const statusBadge = $('status'), startBtn = $('startBtn'), stopBtn = $('stopBtn'), unmuteBtn = $('unmuteBtn');

  const postToWrapper = (msg) => { try { window.chrome?.webview?.postMessage(msg); } catch { } };

  const setStatus = (text, cls = '') => { statusBadge.textContent = text; statusBadge.className = 'badge ' + cls; };
  // The overlay stays (it also holds the unmute button); only the text is hidden.
  const showMessage = (text) => { message.textContent = text; message.classList.toggle('hidden', !text); };

  function randomRoomName() {
    const pick = (list) => list[crypto.getRandomValues(new Uint32Array(1))[0] % list.length];
    const adjectives = ['Red', 'Blue', 'Green', 'Orange', 'Purple', 'Silver', 'Golden', 'Brave', 'Quiet', 'Happy', 'Lucky', 'Swift', 'Cosmic', 'Electric', 'Frozen', 'Wild'];
    const nouns = ['Robots', 'Tigers', 'Rockets', 'Pandas', 'Wizards', 'Dragons', 'Pirates', 'Ninjas', 'Comets', 'Falcons', 'Llamas', 'Knights', 'Otters', 'Ghosts', 'Cactus', 'Penguins'];
    const verbs = ['Dance', 'Jump', 'Sing', 'Fly', 'Race', 'Dream', 'Play', 'Glow', 'Roll', 'Swim', 'Build', 'Laugh', 'Climb', 'Drift', 'Spin', 'Shine'];
    const adverbs = ['Quickly', 'Boldly', 'Softly', 'Wildly', 'Calmly', 'Proudly', 'Gently', 'Loudly', 'Happily', 'Bravely', 'Slowly', 'Brightly', 'Freely', 'Smoothly', 'Madly', 'Wisely'];
    return pick(adjectives) + pick(nouns) + pick(verbs) + pick(adverbs);
  }

  let roomId = decodeURIComponent(location.hash.slice(1));
  if (!roomId) {
    if (!isBroadcaster) {
      setStatus('Link inválido');
      showMessage('Este link não tem uma sala. Peça o link completo para quem está transmitindo.');
      throw new Error('missing room id');
    }
    roomId = randomRoomName();
    history.replaceState(null, '', '#' + roomId);
  }
  $('room').textContent = '#' + roomId;
  document.title = (isBroadcaster ? 'Transmitindo' : 'Assistindo') + ' — ' + roomId;

  const turnServers = await turnServersPromise;
  postToWrapper({ type: 'turn', servers: turnServers.length });

  // rtcConfig.iceServers replaces Trystero's 4 default STUN servers instead of adding to them.
  const roomConfig = turnServers.length
    ? { appId: APP_ID, rtcConfig: { iceServers: turnServers } }
    : { appId: APP_ID };
  const room = joinRoom(roomConfig, roomId, {
    onJoinError: ({ peerId, error }) => {
      console.warn('[LT1] join error', peerId, error);
      // Viewers also mesh with each other, so the failed peer may not be the broadcaster;
      // only complain while nothing is playing. onPeerStream clears the message.
      if (!isBroadcaster && !video.srcObject) {
        setStatus('Sem conexão');
        showMessage('Não foi possível conectar à transmissão: a rede bloqueou a conexão direta. Tente recarregar a página ou outra rede.');
      }
    }
  });

  // Small control channel: the broadcaster tells viewers whether it is live.
  const liveAction = room.makeAction('live');

  if (isBroadcaster) {
    let stream = null;

    const viewerCount = () => Object.keys(room.getPeers()).length;
    const report = () => {
      const count = viewerCount();
      setStatus(stream ? `AO VIVO · ${count} assistindo` : `${count} na sala`, stream ? 'live' : '');
      postToWrapper({ type: 'viewers', count, live: !!stream });
    };

    async function start() {
      try {
        // The wrapper's injected hook adds window-audio and quality options here.
        // Audio: raw game/app sound, like Screensy (voice processing would hurt music/effects).
        stream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: { channelCount: { ideal: 2 }, noiseSuppression: false, echoCancellation: false, autoGainControl: false }
        });
      } catch (e) {
        console.warn('[LT1] capture cancelled', e);
        return;
      }

      stream.getVideoTracks()[0]?.addEventListener('ended', stop);
      video.srcObject = stream;
      showMessage('');
      startBtn.classList.add('hidden');
      stopBtn.classList.remove('hidden');

      room.addStream(stream);
      liveAction.send({ live: true });
      report();
    }

    function stop() {
      if (!stream) return;
      room.removeStream(stream);
      stream.getTracks().forEach(t => t.stop());
      stream = null;
      video.srcObject = null;
      liveAction.send({ live: false });
      startBtn.classList.remove('hidden');
      stopBtn.classList.add('hidden');
      showMessage('Clique em "Iniciar transmissão" e escolha a janela do jogo/aplicativo.');
      report();
    }

    // Late joiners get the current stream directly.
    room.onPeerJoin = (peerId) => {
      if (stream) {
        room.addStream(stream, { target: peerId });
        liveAction.send({ live: true }, { target: peerId });
      }
      report();
    };
    room.onPeerLeave = () => report();

    startBtn.onclick = start;
    stopBtn.onclick = stop;
    startBtn.classList.remove('hidden');
    showMessage('Clique em "Iniciar transmissão" e escolha a janela do jogo/aplicativo.');
    report();
  } else {
    let broadcasterId = null;

    const waiting = () => {
      video.srcObject = null;
      unmuteBtn.classList.add('hidden');
      setStatus('Aguardando');
      showMessage('Aguardando a transmissão começar...');
    };

    room.onPeerStream = (stream, peerId) => {
      broadcasterId = peerId;
      video.srcObject = stream;
      video.play().catch(() => { });
      setStatus('AO VIVO', 'live');
      showMessage('');
      // Browsers block autoplay with sound until the user interacts with the page.
      if (video.muted) unmuteBtn.classList.remove('hidden');
    };

    liveAction.onMessage = (data, { peerId }) => {
      if (data && data.live === false && (broadcasterId === null || peerId === broadcasterId))
        waiting();
    };

    room.onPeerLeave = (peerId) => {
      if (peerId === broadcasterId) {
        broadcasterId = null;
        waiting();
      }
    };

    // ---- Volume control ------------------------------------------------------
    const muteBtn = $('muteBtn'), volumeSlider = $('volumeSlider'), volumeLabel = $('volumeLabel');
    const VOLUME_KEY = 'lt1.volume';

    const savedVolume = (() => {
      try {
        const v = parseInt(localStorage.getItem(VOLUME_KEY), 10);
        return Number.isFinite(v) && v >= 0 && v <= 100 ? v : 100;
      } catch { return 100; }
    })();

    const renderVolume = () => {
      const pct = Math.round(video.volume * 100);
      volumeSlider.value = String(pct);
      volumeLabel.textContent = video.muted ? 'muted' : pct + '%';
      muteBtn.textContent = video.muted || pct === 0 ? '🔇' : pct < 50 ? '🔉' : '🔊';
      // Once the viewer unmutes by any means, the big unmute button is no longer needed.
      if (!video.muted) unmuteBtn.classList.add('hidden');
    };

    const setVolume = (pct) => {
      video.volume = pct / 100;
      video.muted = pct === 0;
      try { localStorage.setItem(VOLUME_KEY, String(pct)); } catch { }
      video.play().catch(() => { });
      renderVolume();
    };

    volumeSlider.addEventListener('input', () => setVolume(parseInt(volumeSlider.value, 10)));

    muteBtn.onclick = () => {
      if (video.muted) {
        // Unmuting at 0% would be silent, so fall back to a sensible level.
        if (video.volume === 0) setVolume(50);
        else { video.muted = false; video.play().catch(() => { }); }
      } else {
        video.muted = true;
      }
      renderVolume();
    };

    unmuteBtn.onclick = () => {
      video.muted = false;
      if (video.volume === 0) video.volume = 0.5;
      video.play().catch(() => { });
      renderVolume();
    };

    // ---- Fullscreen --------------------------------------------------------
    // The whole player (video + controls) goes fullscreen, so the controls stay usable.
    const player = $('player'), controls = $('controls'), fullscreenBtn = $('fullscreenBtn');

    const isFullscreen = () => !!document.fullscreenElement;

    const toggleFullscreen = () => {
      if (isFullscreen()) {
        document.exitFullscreen().catch(() => { });
      } else if (player.requestFullscreen) {
        player.requestFullscreen().catch(() => { });
      } else if (video.webkitEnterFullscreen) {
        video.webkitEnterFullscreen(); // iPhone: only the native video player can go fullscreen
      }
    };

    document.addEventListener('fullscreenchange', () => {
      fullscreenBtn.textContent = isFullscreen() ? '🗗' : '⛶';
      fullscreenBtn.title = isFullscreen() ? 'Sair da tela cheia (F)' : 'Tela cheia (F)';
    });

    fullscreenBtn.onclick = toggleFullscreen;
    video.addEventListener('dblclick', toggleFullscreen);

    // Player shortcuts: M = mute, F = fullscreen.
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      const key = e.key.toLowerCase();
      if (key === 'm') muteBtn.click();
      else if (key === 'f') toggleFullscreen();
    });

    // Hide the controls (and cursor) after a moment without mouse movement while live.
    let idleTimer = 0;
    const wake = () => {
      controls.classList.remove('idle');
      player.classList.remove('idle');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        if (!video.srcObject || controls.matches(':hover')) return;
        controls.classList.add('idle');
        player.classList.add('idle');
      }, 2500);
    };
    player.addEventListener('mousemove', wake);
    player.addEventListener('touchstart', wake, { passive: true });
    document.addEventListener('keydown', wake);

    video.volume = savedVolume / 100; // starts muted anyway (autoplay policy)
    controls.classList.remove('hidden');
    renderVolume();
    wake();

    waiting();
  }

  window.addEventListener('pagehide', () => room.leave());
</script>
</body>
</html>
